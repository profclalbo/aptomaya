<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071423">
<title>Apto 4 Maya - Temporada pé na areia em Itanhaém</title>
<meta name="description" content="Apartamentos e kitnets pé na areia na Av. Beira Mar, em Itanhaém (SP). Veja a disponibilidade, reserve e pague com Pix.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='20' cy='12' r='6.5' fill='%23f6b544'/%3E%3Cpath d='M3 22c3 0 3-2 6.5-2S13 22 16 22s3-2 6.5-2S26 22 29 22v6H3Z' fill='%232ec4c6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<style>
/* ---------- capa / vitrine ---------- */
.hero{position:relative;min-height:min(86svh,760px);overflow:hidden;background:#06101c;color:#fff;display:flex;flex-direction:column}
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.slide.on img{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.12)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,28,.6) 0%,rgba(6,16,28,.05) 26%,rgba(6,16,28,.25) 50%,rgba(6,16,28,.88) 100%);pointer-events:none}
.hero-top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:1180px;width:100%;margin:0 auto}
.hero-top .brand small{color:#d6e3ee}
.hero-top .brand-mark{background:rgba(6,16,28,.5);border-color:rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.hero-top .icon-btn,.hero-top .btn-ghost{background:rgba(6,16,28,.45);border-color:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
.hero-in{position:relative;z-index:3;margin-top:auto;max-width:1180px;width:100%;margin-left:auto;margin-right:auto;padding:0 20px 30px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffd58a;background:rgba(6,16,28,.45);backdrop-filter:blur(6px);padding:7px 12px;border-radius:999px;border:1px solid rgba(255,213,138,.25)}
.hero h1{font-family:var(--fd);font-weight:700;font-size:clamp(34px,6.4vw,64px);line-height:1.03;margin:14px 0 8px;text-shadow:0 4px 30px rgba(0,0,0,.35);max-width:760px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#ffd27a,#ff9a6a 45%,#7fe3e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(15px,2vw,18px);color:#dbe7f0;max-width:580px;line-height:1.5}
.dots{display:flex;gap:7px;margin-top:16px}
.dots button{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.4);transition:all .3s}
.dots button.on{width:26px;background:#ffd27a}
.busca{margin-top:20px;background:var(--card);color:var(--text);border-radius:22px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6);max-width:860px}
.busca .f{border-radius:14px;padding:8px 12px;background:var(--card2);border:1px solid var(--line)}
.busca .f label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.busca .f input,.busca .f select{width:100%;border:0;background:none;outline:none;font-weight:700;font-size:15px;padding:2px 0;min-height:26px}
.busca .btn{min-height:58px;border-radius:16px}
@media(max-width:760px){.busca{grid-template-columns:1fr 1fr}.busca .f.h{grid-column:span 2}.busca .btn{grid-column:span 2;min-height:50px}}
.sec{max-width:1180px;margin:0 auto;padding:48px 20px}
.sec h2{font-family:var(--fd);font-size:clamp(26px,4vw,36px);line-height:1.1;margin-bottom:8px}
.sec .sub{color:var(--muted);max-width:640px;line-height:1.55}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:16px}
.card-u{display:block;color:inherit}
.card-u .ft{position:relative;aspect-ratio:4/3.2;border-radius:20px;overflow:hidden;background:var(--card2)}
.card-u .ft img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card-u:hover .ft img{transform:scale(1.04)}
.card-u .badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.94);color:#10233a;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px}
.card-u .badge.ind{background:rgba(16,35,58,.85);color:#fff}
.card-u .qt{position:absolute;bottom:10px;right:10px;background:rgba(6,16,28,.6);color:#fff;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px}
.card-u .info{padding:12px 4px 0}
.card-u .info .l1{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15.5px}
.card-u .info .l2{color:var(--muted);font-size:13.5px;margin-top:3px}
.card-u .info .pr{margin-top:8px;font-size:15px}
.card-u .info .pr b{font-weight:800}
.card-u.ind{opacity:.5}
.street{border-radius:var(--r2);overflow:hidden;border:1px solid var(--line2);background:var(--card2);aspect-ratio:16/8;min-height:300px;position:relative}
.street iframe{width:100%;height:100%;border:0;display:block}
.street .sem{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.passos{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
@media(max-width:900px){.passos{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.passos{grid-template-columns:1fr}}
.passo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.passo .n{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;margin-bottom:12px;background:rgba(46,196,198,.15);color:var(--sea2)}
[data-tema="escuro"] .passo .n{color:#7fe3e0}
.passo h3{font-size:16px;margin-bottom:6px}
.passo p{font-size:14px;color:var(--muted);line-height:1.5}
.foot{border-top:1px solid var(--line);padding:26px 20px 40px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.foot a{font-weight:700;color:var(--text)}

/* ---------- página da unidade ---------- */
.galeria{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:200px 200px;gap:8px;border-radius:22px;overflow:hidden;margin-top:16px;position:relative}
.galeria img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.galeria .g0{grid-row:span 2}
.galeria .todas{position:absolute;right:14px;bottom:14px}
.galeria-m{display:none}
@media(max-width:760px){
  .galeria{display:none}
  .galeria-m{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;margin:12px -16px 0;scrollbar-width:none;position:relative}
  .galeria-m::-webkit-scrollbar{display:none}
  .galeria-m img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover}
}
.gal-cont{position:relative}
.gal-cont .cont{position:absolute;right:12px;bottom:10px;background:rgba(6,16,28,.65);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;display:none}
@media(max-width:760px){.gal-cont .cont{display:block}}
.u-grid{display:grid;grid-template-columns:1fr 380px;gap:40px;margin-top:24px;align-items:start}
@media(max-width:960px){.u-grid{grid-template-columns:1fr}}
.specs{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14.5px;margin-top:6px}
.specs span{display:inline-flex;align-items:center;gap:6px}
.bloco{padding:22px 0;border-bottom:1px solid var(--line)}
.bloco h3{font-size:18px;margin-bottom:10px}
.bloco p,.bloco li{line-height:1.6;color:var(--text)}
.bloco ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.bloco ul li{padding-left:22px;position:relative;font-size:15px}
.bloco ul li::before{content:"";position:absolute;left:4px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--sea)}
.comods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comods div{display:flex;align-items:center;gap:10px;font-size:15px}
.comods i{font-style:normal;font-size:20px;width:28px;text-align:center}
.reserva-card{position:sticky;top:84px;background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.reserva-card .preco{font-size:22px;font-weight:800}
.reserva-card .preco span{font-size:14px;font-weight:600;color:var(--muted)}
.datas{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:14px;overflow:hidden;margin-top:14px}
.datas button,.datas .hs{padding:10px 12px;text-align:left}
.datas button+button{border-left:1px solid var(--line2)}
.datas .hs{grid-column:span 2;border-top:1px solid var(--line2)}
.datas small{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.datas b{font-size:14.5px}
.datas select{width:100%;border:0;background:none;font-weight:700;font-size:14.5px;outline:none}
.barra-m{display:none}
@media(max-width:960px){
  .reserva-card{position:static}
  .barra-m{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--sheet);border-top:1px solid var(--line2);padding:12px 16px calc(12px + env(safe-area-inset-bottom));align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -10px 30px -20px rgba(0,0,0,.5)}
}
.galeria-full img{width:100%;border-radius:14px;margin-bottom:10px}

/* ---------- formulário da reserva ---------- */
.form-grid{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:start}
@media(max-width:960px){.form-grid{grid-template-columns:1fr}}
.hosp{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.hosp h4{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.resumo{position:sticky;top:84px;background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:16px;box-shadow:var(--shadow2)}
@media(max-width:960px){.resumo{position:static}}
.resumo img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px}
</style>
</head>
<body>
<div id="app"><div class="carregando"><span class="spin"></span>Carregando...</div></div>
<div id="toasts"></div>
<script src="/assets/qrcode.js"></script>
<script src="/assets/comum.js"></script>
<script src="/assets/site.js"></script>
</body>
</html>
