<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071423">
<meta name="robots" content="noindex">
<title>Apto 4 Maya - Painel do proprietário</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='20' cy='12' r='6.5' fill='%23f6b544'/%3E%3Cpath d='M3 22c3 0 3-2 6.5-2S13 22 16 22s3-2 6.5-2S26 22 29 22v6H3Z' fill='%232ec4c6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<style>
.ufoto{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv span{color:var(--muted)}
@media(max-width:560px){.kv{grid-template-columns:1fr}.kv span{margin-top:6px}}
.esp-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
@media(max-width:700px){.esp-row{grid-template-columns:1fr 1fr}}
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela td,.tabela th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.tabela th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div id="app"><div class="carregando"><span class="spin"></span>Carregando...</div></div>
<div id="toasts"></div>
<script src="/assets/qrcode.js"></script>
<script src="/assets/comum.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
